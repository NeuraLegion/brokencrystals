name: "Bright Security Copilot Engine"
description: "Security scanning and auto-remediation engine powered by Bright DAST"
author: "Bright Security"

inputs:
  GITHUB_JOB_ID:
    description: "Unique identifier for the job"
    required: true
  GITHUB_PLATFORM_API_TOKEN:
    description: "Authentication token for platform API calls"
    required: true
  GITHUB_PLATFORM_API_URL:
    description: "Base URL for platform API endpoints"
    required: true
  GITHUB_JOB_NONCE:
    description: "Job nonce for request validation"
    required: false
  BRIGHT_TOKEN:
    description: "Bright API token for MCP server authentication"
    required: true
  BRIGHT_HOSTNAME:
    description: "Bright platform hostname"
    required: false
    default: "app.brightsec.com"
  BRIGHT_PROJECT_ID:
    description: "Bright project ID to use for scanning. Falls back to the first available project."
    required: false
  RUN_MODE:
    description: "Run flow: full, dynamic, or function/functional."
    required: false
    default: "full"

runs:
  using: "node20"
  main: "dist/index.js"
  env:
    GITHUB_JOB_ID: ${{ inputs.GITHUB_JOB_ID }}
    GITHUB_PLATFORM_API_TOKEN: ${{ inputs.GITHUB_PLATFORM_API_TOKEN }}
    GITHUB_PLATFORM_API_URL: ${{ inputs.GITHUB_PLATFORM_API_URL }}
    GITHUB_JOB_NONCE: ${{ inputs.GITHUB_JOB_NONCE }}
    BRIGHT_TOKEN: ${{ inputs.BRIGHT_TOKEN }}
    BRIGHT_HOSTNAME: ${{ inputs.BRIGHT_HOSTNAME }}
    BRIGHT_PROJECT_ID: ${{ inputs.BRIGHT_PROJECT_ID }}
    RUN_MODE: ${{ inputs.RUN_MODE }}
