services:
  db:
    image: 'postgres:17-alpine'
    restart: always
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      timeout: 45s
    environment:
      POSTGRES_DB: ${DATABASE_SCHEMA}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - './pg.sql:/docker-entrypoint-initdb.d/pg.sql'
      - '.data/nodejs:/var/lib/postgresql/data/'

  nodejs:
    image: 'brightsec/brokencrystals'
    restart: always
    healthcheck:
      interval: 5s
      retries: 10
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/api/config']
      timeout: 30s
    environment:
      NODE_ENV: production
      GRPC_WEB_PROXY_URL: ${GRPC_WEB_PROXY_URL}
      CHAT_API_URL: ${CHAT_API_URL}
      CHAT_API_MODEL: ${CHAT_API_MODEL}
      CHAT_API_TOKEN: ${CHAT_API_TOKEN}
      CHAT_API_MAX_TOKENS: ${CHAT_API_MAX_TOKENS}
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: 3.5
    logging:
      options:
        max-file: '5'
        max-size: '10m'
    depends_on:
      - db

  grpcwebproxy:
    image: webis/grpcwebproxy:0.14.0
    command:
      - grpcwebproxy
      - '--backend_addr=nodejs:5000'
      - '--run_tls_server=false'
      - '--run_http_server=true'
      - '--server_http_debug_port=8081'
      - '--allow_all_origins'
    ports:
      - '8081:8081'
    depends_on:
      - nodejs

  keycloak-db:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      timeout: 45s
    restart: on-failure
    volumes:
      - '.data/keycloak:/var/lib/postgresql/data/'

volumes:
  letsencrypt:
