server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Block access to any dotfile or sensitive configuration artifact.
  # This protects against accidental exposure of .env and similar files.
  location ~ (^|/)\.(?!well-known)(.*)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~* (?:^|/)(?:\.env(?:\..*)?|nginx\.conf|config\.js|\.htaccess|\.git(?:/|$)|\.gitignore|\.gitmodules)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
