server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Deny direct access to sensitive files explicitly, including nginx.conf.
  location = /nginx.conf {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  # Block access to common sensitive files and deployment artifacts.
  location ~* (?:^|/)(?:\.env(?:\..*)?|config\.js|nginx\.conf|\.git(?:/|$)|\.gitignore|\.gitmodules|\.htaccess)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  # Prevent hidden files from being served while still allowing well-known paths.
  location ~* (^|/)(?:\.|%2e)(?!well-known)([^/]+)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
