server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Block access to common sensitive files and configuration artifacts before
  # the SPA fallback can serve index.html.
  location = /nginx.conf {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location = /.htaccess {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~* (?:^|/)(?:\.env(?:\..*)?|config\.js|\.git(?:/|$)|\.gitignore|\.gitmodules)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~ (^|/)\.(?!well-known)(.*)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
