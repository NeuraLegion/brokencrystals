server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Deny access to hidden files and sensitive config artifacts before any SPA
  # fallback can rewrite the request to index.html.
  location = /.htaccess {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location = /nginx.conf {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~ (^|/)\.(?!well-known)([^/]+)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~* (?:^|/)(?:\.env(?:\..*)?|config\.js|\.git(?:/|$)|\.gitignore|\.gitmodules)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
