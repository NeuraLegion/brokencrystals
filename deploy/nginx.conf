server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Never serve hidden files or common sensitive artifacts from the web root.
  # This must be evaluated before the SPA fallback.
  location ~* (^|/)(?:\.|%2e)(?!well-known)([^/]+)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~* (?:^|/)(?:\.env(?:\..*)?|\.git(?:/|$)|\.gitignore|\.gitmodules|\.htaccess|config\.js|nginx\.conf)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
