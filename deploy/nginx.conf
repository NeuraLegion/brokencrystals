server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Explicitly block common sensitive files and hidden artifacts.
  location ~* (?:^|/)(?:\.(?:env(?:\..*)?|git(?:/|$)|gitignore|gitmodules|htaccess)|config\.js|nginx\.conf)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  # Block any hidden file path not otherwise allowed.
  location ~* (^|/)(?:\.|%2e)(?!well-known)([^/]+)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
