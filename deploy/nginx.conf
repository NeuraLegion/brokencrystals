server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Explicitly block common sensitive files even if a broader dotfile rule is
  # bypassed or overridden in a derived/runtime configuration.
  location = /.htaccess {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location = /nginx.conf {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~ /(?:\.git|\.env|\.htaccess|nginx\.conf)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  # Deny all hidden files by default, while still allowing ACME challenges.
  location ~ /\.(?!well-known)(?:.*)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
