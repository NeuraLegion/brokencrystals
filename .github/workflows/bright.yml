name: Bright

on:
  pull_request:
    branches:
      - '**'

permissions:
  checks: write
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application
        env:
          KC_BOOTSTRAP_ADMIN_PASSWORD: Pa55w0rd
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_DB: postgres
          KC_DB_PASSWORD: password
          KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
          KC_DB_USERNAME: keycloak
          KC_HEALTH_ENABLED: 'true'
          KC_HOSTNAME_STRICT: 'false'
          KC_HOSTNAME_STRICT_HTTPS: 'false'
          POSTGRES_DB: bc
          POSTGRES_PASSWORD: bc
          POSTGRES_USER: bc
          URL: http://localhost:3000
        run: |
          docker compose --file=compose.local.yml up -d

      - name: Probe application readiness
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000 && exit 0 || sleep 5; done; exit 1

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install SecTesterJS dependencies
        run: |
          npm i --save=false --prefix .brightsec \
            @sectester/core@0.47.0 \
            @sectester/repeater@0.47.0 \
            @sectester/scan@0.47.0 \
            @sectester/runner@0.47.0 \
            @sectester/reporter@0.47.0

      - name: Authenticate with Bright
        uses: ./.github/workflows/composite/configure-bright-credentials
        with:
          BRIGHT_HOSTNAME: development.playground.brightsec.com
          BRIGHT_PROJECT_ID: bSLRUwVyZ9aMHv4S9BrwaW
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}

      - name: Run security tests
        env:
          BRIGHT_HOSTNAME: development.playground.brightsec.com
          BRIGHT_PROJECT_ID: bSLRUwVyZ9aMHv4S9BrwaW
          BRIGHT_AUTH_ID: ${{ vars.BRIGHT_AUTH_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ env.BRIGHT_TOKEN }}
          BRIGHT_TARGET_URL: http://127.0.0.1:3000
          SECTESTER_SCAN_POOL_SIZE: ${{ vars.SECTESTER_SCAN_POOL_SIZE }}
        run: |
          node --experimental-transform-types \
            --experimental-strip-types \
            --experimental-detect-module \
            --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            --disable-warning=ExperimentalWarning \
            --test-force-exit \
            --test-concurrency=4 \
            --test .brightsec/tests/*.test.ts