name: Bright Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to crawl (must be reachable from GitHub runners)"
        required: true
        default: "https://brokencrystals.com/"
      scan_name:
        description: "Scan name shown in the Bright dashboard"
        required: false
        default: "brokencrystals CI scan"
      severity:
        description: "Fail the job on first issue of this severity or higher"
        required: true
        default: "high"
        type: choice
        options:
          - any
          - medium
          - high
          - critical
      timeout_seconds:
        description: "How long to wait for issues before exiting"
        required: false
        default: "1800"
      project_id:
        description: "Bright project ID (leave blank to use repo var BRIGHT_PROJECT_ID)"
        required: false
        default: ""

permissions:
  contents: read
  security-events: write

jobs:
  bright:
    name: DAST scan
    runs-on: ubuntu-latest
    steps:
      - name: Start Bright scan
        id: start
        uses: NeuraLegion/run-scan@v1.4
        with:
          api_token: ${{ secrets.BRIGHT_TOKEN }}
          name: ${{ inputs.scan_name }} ${{ github.sha }}
          project_id: ${{ inputs.project_id != '' && inputs.project_id || vars.BRIGHT_PROJECT_ID }}
          discovery_types: |
            ["crawler"]
          crawler_urls: |
            ["${{ inputs.target_url }}"]
          tests: |
            ["amazon_s3_takeover","bopla","broken_access_control","broken_saml_auth","brute_force_login","business_constraint_bypass","common_files","cookie_security","csrf","css_injection","cve_test","date_manipulation","default_login_location","directory_listing","email_injection","excessive_data_exposure","file_upload","full_path_disclosure","graphql_introspection","header_security","html_injection","http_method_fuzzing","id_enumeration","iframe_injection","improper_asset_management","insecure_output_handling","insecure_tls_configuration","jwt","ldapi","lfi","lrrl","nosql","open_cloud_storage","open_database","osi","prompt_injection","proto_pollution","retire_js","rfi","secret_tokens","server_side_js_injection","sqli","ssrf","ssti","stored_xss","unvalidated_redirect","version_control_systems","wordpress","xpathi","xss","xxe"]

      - name: Show scan URL
        run: echo "Scan started - ${{ steps.start.outputs.url }}"

      - name: Wait for issues
        uses: NeuraLegion/wait-for@v1.1
        with:
          api_token: ${{ secrets.BRIGHT_TOKEN }}
          scan: ${{ steps.start.outputs.id }}
          wait_for: ${{ inputs.severity }}
          timeout: ${{ inputs.timeout_seconds }}
          stop_scan: true
          code_scanning_alerts: true
