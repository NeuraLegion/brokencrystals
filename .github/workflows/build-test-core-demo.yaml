name: "Build & Test BrokenCrystals for Core Demo env"

on:
  workflow_dispatch:

env:
  INVICTI_ASPM_HOST: ${{ secrets.INVICTI_ASPM_HOST_CORE }}
  INVICTI_ASPM_TOKEN: ${{ secrets.INVICTI_ASPM_TOKEN_CORE }}

jobs:
  build-test-project:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged --shm-size=2g
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    steps:
      - name: Cleanout
        run: |
          rm -Rf *

      - name: Prepare scan output directory
        run: |
          mkdir -p ${{ github.workspace }}/scan-output
          mkdir -p ${{ github.workspace }}/code
          
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path:
            ${{ github.workspace }}/code
      
      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Install npm project dependencies
        working-directory: code/
        run: |
          npm install

      - name: Build npm project
        working-directory: code/
        run: |
          npm run build

      - name: Install NPM SBOM Generator
        working-directory: code/
        run: |
          npm install sbom
      
      - name: Run NPM SBOM Generator
        working-directory: code/
        run: |
          npm sbom --sbom-format=cyclonedx > sbom.json
          
      - name: Setup KDT
        run: |
          curl -sSL https://cli.kondukto.io | sh

      - name: Test KDT Auth
        run: |
          kdt ping -a --insecure

      - name: Import SBOM
        working-directory: code/
        run: |
          kdt sbom import -p BrokenCrystals-Project -b stable -f ${{ github.workspace }}/code/sbom.json --insecure

      - name: Run Invicti SAST Scan
        run: |
          kdt scan -p BrokenCrystals-Project -b stable -t invictisast --insecure

      - name: Run Invicti Secrets Scan
        run: |
          kdt scan -p BrokenCrystals-Project -b stable -t invictisecrets --insecure

      - name: Run Invicti SCA Scan
        run: |
          kdt scan -p BrokenCrystals-Project -b stable -t invictisca --insecure

      - name: Run Invicti CS Scan
        run: |
          kdt scan -p BrokenCrystals-Project -b stable -t invictics --insecure

      - name: Run Invicti IAC Scan
        run: |
          kdt scan -p BrokenCrystals-Project -b stable -t invictiiac --insecure

      - name: Login to Invicti Registry
        uses: docker/login-action@v3
        with:
          registry: registry.invicti.com
          username: benjamin.strozykowski@invicti.com
          password: ${{ secrets.INVICTI_LICENSE_KEY_CORE }}
      
      - name: "Stage 1 - Source Scan (API discovery)"
        working-directory: ${{ github.workspace }}
        run: |
          chown -R 1001:1001 .
          docker run --rm \
            --user 1001:1001 \
            -e INVICTI_URL="${{ secrets.INVICTI_ASPM_HOST_CORE }}" \
            -e INVICTI_USER=benjamin.strozykowski@invicti.com \
            -e INVICTI_JWT_TOKEN="${{ secrets.INVICTI_JWT_TOKEN_CORE }}" \
            -e INVICTI_WEBSITE_ID=${{ vars.INVICTI_TARGET_ID_CORE }} \
            -e INVICTI_SYNC=true \
            -e SCANNER_ENABLE_TAINT=true \
            -e SCANNER_FAIL_ON_CRITICAL=false \
            -e SCANNER_AI_ENRICH=false \
            -v ${{ github.workspace }}/code:/code:ro \
            -v ${{ github.workspace }}/scan-output:/output \
            -v ~/.invicti-source-scan-cache:/.cache/enrichment \
            registry.invicti.com/invicti-platform/invicti-source-scan:latest

      - name: Verify source scan outputs
        run: |
          echo "── scan-output/ ──────────────────────────────────────────────"
          ls -lh ${{ github.workspace }}/scan-output/

          if [ ! -f "${{ github.workspace }}/scan-output/openapi.json" ]; then
            echo "::error::openapi.json not found — source scanner did not produce a spec."
            exit 1
          fi

          ENDPOINT_COUNT=$(jq '[.paths | to_entries | length] | add // 0' \
            ${{ github.workspace }}/scan-output/openapi.json)
          echo "::notice::Source scan discovered ${ENDPOINT_COUNT} API endpoint(s)."

      - name: Pull scan-cli image
        run: docker pull invicti/scan-cli:latest

      - name: "Stage 3 - DAST Scan (EphemeralAgent)"
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/scan-output:/scan-output:ro \
            -v ${{ github.workspace }}/dast-results:/results \
            -e INVICTI_API_BASE_URL="${{ secrets.INVICTI_ASPM_HOST_CORE }}" \
            -e INVICTI_API_TOKEN="${{ secrets.INVICTI_ASPM_TOKEN_CORE }}" \
            -e INVICTI_TARGET_ID="${{ secrets.INVICTI_TARGET_ID }}" \
            -e INVICTI_TARGET_URL="https://brokencrystals.com:443" \
            -e INVICTI_SCAN_AGENT="Cloud" \
            -e INVICTI_SCAN_PROFILE="Full Scan" \
            -e INVICTI_IMPORT_FILE_PATHS="/scan-output/openapi.json" \
            -e INVICTI_REPORT_TEMPLATE="Comprehensive" \
            -e INVICTI_SCAN_TIMEOUT=60 \
            invicti/scan-cli:latest
