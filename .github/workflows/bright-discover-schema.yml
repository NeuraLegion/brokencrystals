name: Bright Discovery - schema (OpenAPI / Postman)

on:
  workflow_dispatch:
    inputs:
      schema_file_path:
        description: "Path to the schema file inside this repo"
        required: true
        default: ".bright/schemas/openapi.yaml"
      schema_type:
        description: "Schema type"
        required: true
        default: "openapi"
        type: choice
        options:
          - openapi
          - postman
      discovery_name:
        description: "Discovery name shown in Bright"
        required: false
        default: "schema discovery"
      auth_object_id:
        description: "Auth object ID (leave blank to use repo var BRIGHT_AUTH_OBJECT_ID, or blank for anonymous)"
        required: false
        default: ""
      project_id:
        description: "Bright project ID (leave blank to use repo var BRIGHT_PROJECT_ID)"
        required: false
        default: ""
      wait_timeout_seconds:
        description: "How long to wait for discovery to finish"
        required: false
        default: "1800"

permissions:
  contents: read

jobs:
  discover:
    name: Schema discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve IDs and verify schema
        id: ids
        run: |
          PID="${{ inputs.project_id }}"
          [ -z "$PID" ] && PID="${{ vars.BRIGHT_PROJECT_ID }}"
          if [ -z "$PID" ]; then echo "::error::No project ID"; exit 1; fi
          AID="${{ inputs.auth_object_id }}"
          [ -z "$AID" ] && AID="${{ vars.BRIGHT_AUTH_OBJECT_ID }}"
          if [ ! -f "${{ inputs.schema_file_path }}" ]; then
            echo "::error::Schema file not found: ${{ inputs.schema_file_path }}"
            exit 1
          fi
          echo "project=$PID" >> "$GITHUB_OUTPUT"
          echo "auth=$AID" >> "$GITHUB_OUTPUT"

      - name: Upload schema to Bright
        id: upload
        env:
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
          PROJECT_ID: ${{ steps.ids.outputs.project }}
          SCHEMA_PATH: ${{ inputs.schema_file_path }}
          SCHEMA_TYPE: ${{ inputs.schema_type }}
        run: |
          FILE_ID=$(docker run --rm \
            -v "$PWD:/work" -w /work \
            brightsec/cli:latest archive:upload \
              --token "$BRIGHT_TOKEN" \
              --project "$PROJECT_ID" \
              --type "$SCHEMA_TYPE" \
              "$SCHEMA_PATH" | tail -n1 | tr -d '\r\n')
          if [ -z "$FILE_ID" ]; then echo "::error::archive:upload returned empty file_id"; exit 1; fi
          echo "Uploaded file_id=$FILE_ID"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"

      - name: Start schema discovery
        id: start
        uses: NeuraLegion/run-discovery@v1.1
        with:
          api_token: ${{ secrets.BRIGHT_TOKEN }}
          name: ${{ inputs.discovery_name }} ${{ github.sha }}
          project_id: ${{ steps.ids.outputs.project }}
          auth_object_id: ${{ steps.ids.outputs.auth }}
          discovery_types: |
            ["oas"]
          file_id: ${{ steps.upload.outputs.file_id }}

      - name: Show discovery URL
        run: echo "Discovery - ${{ steps.start.outputs.url }}"

      - name: Wait for discovery
        uses: NeuraLegion/wait-for-discovery@v1
        with:
          api_token: ${{ secrets.BRIGHT_TOKEN }}
          discovery_id: ${{ steps.start.outputs.id }}
          project_id: ${{ steps.ids.outputs.project }}
          timeout: ${{ inputs.wait_timeout_seconds }}
