server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Explicitly block common sensitive files even if broader static-file rules are
  # changed during deployment.
  location = /.htaccess {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location = /nginx.conf {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~ /(?:\.git|\.env|\.htaccess|nginx\.conf)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~ /\.(?!well-known)(?:.*)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
