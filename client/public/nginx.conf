server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ~* (^|/)(?:\.|%2e)(?!well-known)([^/]+)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~* (?:^|/)(?:\.env(?:\..*)?|config\.js|nginx\.conf|\.git(?:/|$)|\.gitignore|\.gitmodules|\.htaccess)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
